[package]
name = "serious-shift-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for mirroring an innovation's cover image, and only to allowlisted hosts.
# default-features off: rustls rather than the system OpenSSL (the runtime image
# is debian-slim with ca-certificates and nothing else), and no gzip/brotli
# decoding — these responses are already-compressed images.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Content hashes: the ingest idempotency key, and the cover image's ETag.
sha2 = "0.10"
tower = "0.5"          # ServiceBuilder, to layer headers onto a ServeDir
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip", "fs", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
brotli = "8"
