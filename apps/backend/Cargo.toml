[package]
name = "serious-shift-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"          # ServiceBuilder, to layer headers onto a ServeDir
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs", "set-status", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
