[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["serious_shift_pipeline*"]

[project]
name = "serious-shift-pipeline"
version = "0.1.0"
description = "Serious Shift ingestion & intelligence pipeline (scrape -> LLM extract -> map/keynote), Postgres-backed."
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.10",
    "youtube-transcript-api>=1.0",   # instance .fetch() API + proxies module
    "yt-dlp>=2024.1.0",
    "anthropic>=0.40.0",        # Claude API client (extraction + generation)
]

[project.optional-dependencies]
build = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
]
dev = [
    "pytest>=8.0",
    # Ruff 0.16 expands the effective default rule set for this legacy tree.
    # Keep CI deterministic until PR 5 introduces hash-locked dev tooling and
    # addresses the expanded rules with dedicated behavior tests.
    "ruff==0.15.13",
    "mypy>=1.10",
    "pip-audit>=2.10",
    "sqlglot>=25.0",            # server-free SQL validation (test_queries_sql.py)
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# E701/E702: terse one-liners (`if x: y`, `a; b`) are used heavily in the
# generator code carried over from the legacy scripts; allow them.
lint.ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "serious_shift_pipeline.run",
    "serious_shift_pipeline.steps.deduplicate",
    "serious_shift_pipeline.steps.scraper.handlers",
    "serious_shift_pipeline.steps.scraper.runner",
]
check_untyped_defs = true
