<stop offset="0.8" stop-color="#23B9A6"/><stop offset="1" stop-color="#E6FF9C"/>
</linearGradient>
<linearGradient id="beamgraphmoat" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E6FF9C" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#E6FF9C" stop-opacity="0.3"/>
