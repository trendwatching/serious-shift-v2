<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
<title>expert-displacement</title>
<defs>
<linearGradient id="skyexpertdisplacement" x1="0" y1="0" x2="0.55" y2="1">
<stop offset="0" stop-color="#FF6A1F"/><stop offset="0.42" stop-color="#E74707"/>
<stop offset="0.8" stop-color="#F2A03A"/><stop offset="1" stop-color="#FDFF85"/>
</linearGradient>
<linearGradient id="beamexpertdisplacement" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#FDFF85" stop-opacity="0.3"/>
