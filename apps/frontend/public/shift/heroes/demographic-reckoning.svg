<stop offset="0.8" stop-color="#F2734A"/><stop offset="1" stop-color="#FDFF85"/>
</linearGradient>
<linearGradient id="beamdemographicreckoning" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#FDFF85" stop-opacity="0.3"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</linearGradient>
<radialGradient id="discdemographicreckoning">
<stop offset="0.72" stop-color="#FDFF85" stop-opacity="0.92"/>
<stop offset="0.86" stop-color="#FDFF85" stop-opacity="0.34"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowdemographicreckoning" cx="42%" cy="34%" r="62%">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.42"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hazedemographicreckoning" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F2734A" stop-opacity="0"/>
<stop offset="0.5" stop-color="#F2734A" stop-opacity="0.42"/>
<stop offset="1" stop-color="#F2734A" stop-opacity="0"/>
</linearGradient>
