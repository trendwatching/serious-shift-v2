<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
<title>integration-chasm</title>
<defs>
<linearGradient id="skyintegrationchasm" x1="0" y1="0" x2="0.55" y2="1">
<stop offset="0" stop-color="#C2C64F"/><stop offset="0.42" stop-color="#9A9A43"/>
<stop offset="0.8" stop-color="#4E9A62"/><stop offset="1" stop-color="#EFFAB4"/>
</linearGradient>
<linearGradient id="beamintegrationchasm" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#EFFAB4" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#EFFAB4" stop-opacity="0.3"/>
<stop offset="1" stop-color="#EFFAB4" stop-opacity="0"/>
</linearGradient>
<radialGradient id="discintegrationchasm">
<stop offset="0.72" stop-color="#EFFAB4" stop-opacity="0.92"/>
<stop offset="0.86" stop-color="#EFFAB4" stop-opacity="0.34"/>
<stop offset="1" stop-color="#EFFAB4" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowintegrationchasm" cx="57%" cy="34%" r="62%">
<stop offset="0" stop-color="#EFFAB4" stop-opacity="0.42"/>
<stop offset="1" stop-color="#EFFAB4" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hazeintegrationchasm" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4E9A62" stop-opacity="0"/>
<stop offset="0.5" stop-color="#4E9A62" stop-opacity="0.42"/>
<stop offset="1" stop-color="#4E9A62" stop-opacity="0"/>
