<linearGradient id="hazedemographicgravity" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F2734A" stop-opacity="0"/>
<stop offset="0.5" stop-color="#F2734A" stop-opacity="0.42"/>
