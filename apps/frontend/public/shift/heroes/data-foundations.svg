<stop offset="0.72" stop-color="#EFFAB4" stop-opacity="0.92"/>
<stop offset="0.86" stop-color="#EFFAB4" stop-opacity="0.34"/>
<stop offset="1" stop-color="#EFFAB4" stop-opacity="0"/>
</radialGradient>
