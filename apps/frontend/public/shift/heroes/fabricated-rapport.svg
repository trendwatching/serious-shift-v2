<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
<title>fabricated-rapport</title>
<defs>
<linearGradient id="skyfabricatedrapport" x1="0" y1="0" x2="0.55" y2="1">
