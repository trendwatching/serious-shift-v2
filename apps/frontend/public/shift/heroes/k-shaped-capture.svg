<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
<title>k-shaped-capture</title>
<defs>
<linearGradient id="skykshapedcapture" x1="0" y1="0" x2="0.55" y2="1">
<stop offset="0" stop-color="#0FA6FF"/><stop offset="0.42" stop-color="#0A7FDA"/>
<stop offset="0.8" stop-color="#23B9A6"/><stop offset="1" stop-color="#E6FF9C"/>
</linearGradient>
<linearGradient id="beamkshapedcapture" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E6FF9C" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#E6FF9C" stop-opacity="0.3"/>
<stop offset="1" stop-color="#E6FF9C" stop-opacity="0"/>
</linearGradient>
<radialGradient id="disckshapedcapture">
<stop offset="0.72" stop-color="#E6FF9C" stop-opacity="0.92"/>
<stop offset="0.86" stop-color="#E6FF9C" stop-opacity="0.34"/>
<stop offset="1" stop-color="#E6FF9C" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowkshapedcapture" cx="45%" cy="34%" r="62%">
<stop offset="0" stop-color="#E6FF9C" stop-opacity="0.42"/>
<stop offset="1" stop-color="#E6FF9C" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hazekshapedcapture" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#23B9A6" stop-opacity="0"/>
<stop offset="0.5" stop-color="#23B9A6" stop-opacity="0.42"/>
