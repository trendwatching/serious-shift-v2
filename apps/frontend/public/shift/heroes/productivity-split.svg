<stop offset="0.8" stop-color="#23B9A6"/><stop offset="1" stop-color="#E6FF9C"/>
</linearGradient>
<linearGradient id="beamproductivitysplit" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E6FF9C" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#E6FF9C" stop-opacity="0.3"/>
<stop offset="1" stop-color="#E6FF9C" stop-opacity="0"/>
</linearGradient>
<radialGradient id="discproductivitysplit">
<stop offset="0.72" stop-color="#E6FF9C" stop-opacity="0.92"/>
<stop offset="0.86" stop-color="#E6FF9C" stop-opacity="0.34"/>
<stop offset="1" stop-color="#E6FF9C" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowproductivitysplit" cx="47.1%" cy="34%" r="62%">
<stop offset="0" stop-color="#E6FF9C" stop-opacity="0.42"/>
<stop offset="1" stop-color="#E6FF9C" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hazeproductivitysplit" x1="0" y1="0" x2="0" y2="1">
