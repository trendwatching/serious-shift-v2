<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
<title>linguistic-lock-in</title>
<defs>
<linearGradient id="skylinguisticlockin" x1="0" y1="0" x2="0.55" y2="1">
<stop offset="0" stop-color="#FF007A"/><stop offset="0.42" stop-color="#E8006F"/>
<stop offset="0.8" stop-color="#F2734A"/><stop offset="1" stop-color="#FDFF85"/>
</linearGradient>
<linearGradient id="beamlinguisticlockin" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.72"/>
<stop offset="0.55" stop-color="#FDFF85" stop-opacity="0.3"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</linearGradient>
<radialGradient id="disclinguisticlockin">
<stop offset="0.72" stop-color="#FDFF85" stop-opacity="0.92"/>
<stop offset="0.86" stop-color="#FDFF85" stop-opacity="0.34"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowlinguisticlockin" cx="58%" cy="34%" r="62%">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.42"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hazelinguisticlockin" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F2734A" stop-opacity="0"/>
<stop offset="0.5" stop-color="#F2734A" stop-opacity="0.42"/>
