<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
<title>recursive-risk/recursive-threshold</title>
<defs>
<linearGradient id="frecursiveriskrecursivethreshold" x1="0" y1="0" x2="0.6" y2="1">
<stop offset="0" stop-color="#FF007A"/><stop offset="0.42" stop-color="#E8006F"/>
<stop offset="0.8" stop-color="#F2734A"/><stop offset="1" stop-color="#FDFF85"/>
</linearGradient>
<radialGradient id="grecursiveriskrecursivethreshold" cx="46%" cy="30%" r="60%">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.3"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</radialGradient>
<linearGradient id="brecursiveriskrecursivethreshold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FDFF85" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#FDFF85" stop-opacity="0.15"/>
<stop offset="1" stop-color="#FDFF85" stop-opacity="0"/>
</linearGradient>
<filter id="srecursiveriskrecursivethreshold" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="22"/>
</filter>
<radialGradient id="vrecursiveriskrecursivethreshold" cx="50%" cy="40%" r="72%">
<stop offset="0.5" stop-color="#39001F" stop-opacity="0"/>
