<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!--
      Build-time defaults only. The backend rewrites the page title, the
      description and the social tags per route from the live map document
      (apps/backend/src/seo.rs) — a static bundle cannot know how many shifts
      there are this week.

      Do NOT write a literal title tag inside this comment. seo::render swaps
      the first one it finds in the document, and if that match lands in here
      the comment never closes: the script and stylesheet below get swallowed
      into it and the page ships as a blank document.
    -->
    <title>Serious Shift — Everything that is about to change</title>
    <meta name="description" content="What is about to change, and who is saying so. A weekly trend map built from sourced evidence." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
