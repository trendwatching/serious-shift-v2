name: frontend

# Builds the SPA's static export (what the backend image bundles and serves).
on:
  push:
    paths: ["apps/frontend/**", "packages/contracts/**", "security/audit-waivers.json", "railway*.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/frontend/**", "packages/contracts/**", "security/audit-waivers.json", "railway*.json", ".github/workflows/frontend.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Slug parity with the pipeline
        # These two implementations must agree byte-for-byte or every shift with
        # punctuation in its title deep-links to a 404.
        run: npm run check:slugs
      - name: WCAG AA contrast tokens
        run: npm run check:contrast
      - name: Every rule layered, desktop in one file
        run: npm run check:layers
      - name: Sphere palettes agree
        run: npm run check:accents
      - name: Hero posters match their manifest
        # A manifest entry with no file on disk ships a broken hero image, and
        # neither half of that pair is visible in a diff.
        run: npm run check:heroes
      - name: Portrait posters still redraw byte-identically
        # poster() gained a frame so it could draw the landscape cut too, and
        # every absolute length in it is now multiplied by a knob. The knobs are
        # 1 in the portrait frame, so the 51 committed SVGs must not move — and
        # the failure is silent, because a shifted rng stream changes every
        # poster just subtly enough to pass review.
        run: npm run check:frame
      - run: npm run build
      - name: Every class in the source styles something
        # `w-prose` is not a Tailwind class. It sat in five places on /about,
        # emitted no CSS, and was the only thing holding that page's masthead.
        # A typo'd utility is invisible in review; the built stylesheet is the
        # only oracle, so this runs after the build.
        run: npm run check:classes
      - name: Unit and component tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser, axe, and visual regression tests
        run: npm run test:e2e
      - name: Assert a static export was produced
        # A broken Vite build still exits 0 if the entry is missing, so assert the artefacts
        # a server-only feature; the backend image would then ship nothing.
        run: test -f out/index.html && test -d out/assets
