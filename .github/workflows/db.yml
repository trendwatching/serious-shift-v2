name: db

# Owns the data contract. On any change under packages/db, prove the migrations
# apply cleanly to a real Postgres and (on demand) that the legacy SQLite import
# is lossless. This is the live verification the local Docker run stands in for.

on:
  push:
    paths: ["packages/db/**", ".github/workflows/db.yml"]
  pull_request:
    paths: ["packages/db/**", ".github/workflows/db.yml"]
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: serious
          POSTGRES_PASSWORD: serious
          POSTGRES_DB: serious_shift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serious -d serious_shift"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://serious:serious@localhost:5432/serious_shift?sslmode=disable
      DBMATE_MIGRATIONS_DIR: ./migrations
      DBMATE_SCHEMA_FILE: ./schema.sql
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v7

      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
          dbmate --version

      - name: Apply migrations
        run: dbmate up

      - name: Assert schema shape
        # Semantic rather than a table count: a bare count is brittle (it drifts
        # on every added table) and says nothing about *which* tables. These are
        # the invariants that actually matter.
        run: |
          missing=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(t, ',') FROM unnest(ARRAY[
              'claims','thinkers','sources','predictions','documents',
              'domains_v2','domain_key_trends','domain_sub_trends','scrape_sources'
            ]) AS t
            WHERE to_regclass('public.'||t) IS NULL;")
          test -z "$missing" || { echo "missing tables: $missing"; exit 1; }

          resurrected=$(psql "$DATABASE_URL" -tAc "
            SELECT string_agg(t, ',') FROM unnest(ARRAY[
              'concepts','tensions','claim_concepts','concept_thinkers','thinker_disagreements'
            ]) AS t
            WHERE to_regclass('public.'||t) IS NOT NULL;")
          test -z "$resurrected" || { echo "dropped tables came back: $resurrected"; exit 1; }

      - name: Rollback + re-apply (down/up reversibility)
        run: |
          dbmate rollback
          dbmate up

      - name: schema.sql matches the migrations
        # The committed dump is documentation and a fast rebuild path. It went
        # six migrations stale once; this makes that impossible. pg_dump embeds
        # its OS packaging in two comments and Postgres 17+ adds a session-only
        # transaction_timeout SET. Compare after removing only that metadata;
        # every schema object remains strict.
        run: |
          dbmate dump
          git show HEAD:schema.sql | sed '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^SET transaction_timeout = 0;$/d' > /tmp/schema.expected.sql
          sed '/^-- Dumped from database version /d; /^-- Dumped by pg_dump version /d; /^SET transaction_timeout = 0;$/d' schema.sql > /tmp/schema.actual.sql
          diff -u /tmp/schema.expected.sql /tmp/schema.actual.sql \
            || { echo "schema.sql is out of date — run 'dbmate dump' and commit"; exit 1; }

      - name: Scrape manifest survives the legacy import
        # This used to live only in etl-parity, which is workflow_dispatch-only
        # because it needs the 37 MB serious-shift.db. That is exactly why the
        # CASCADE that silently deleted all 120 scrape sources went unnoticed.
        # The regression test builds its own throwaway SQLite, so it runs here,
        # on every change to packages/db, with no large fixture.
        working-directory: apps/pipeline
        env:
          SS_ALLOW_DESTRUCTIVE_TESTS: "1"
          SS_PACKAGES_DIR: ${{ github.workspace }}/packages
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
          pytest tests/test_etl_manifest.py -q

  etl-parity:
    # Heavier: imports the legacy SQLite DB, proves losslessness, and checks the
    # exported map document against its golden digest.
    #
    # NOTE: serious-shift.db is gitignored (35 MB), so this job only works where
    # that file is provided — a self-hosted runner, or an artifact/LFS fetch added
    # to the checkout step. It is workflow_dispatch-only for that reason.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: serious
          POSTGRES_PASSWORD: serious
          POSTGRES_DB: serious_shift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serious -d serious_shift"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://serious:serious@localhost:5432/serious_shift?sslmode=disable
      DBMATE_MIGRATIONS_DIR: ./migrations
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
      - run: pip install "psycopg[binary]"
      - name: Migrate + import + verify
        run: |
          dbmate up
          python etl/sqlite_to_postgres.py --sqlite ../../serious-shift.db --truncate
          python etl/verify_parity.py     --sqlite ../../serious-shift.db

      - name: Map export golden
        # Re-exports the map from the imported rows (no API calls) and compares it
        # to the recorded digest — the regression net for mapgen/export.py.
        working-directory: apps/pipeline
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
          python -m serious_shift_pipeline.mapgen.cli --export-only
          pytest tests/test_map_export_golden.py -q
