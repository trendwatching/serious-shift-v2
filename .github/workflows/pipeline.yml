name: pipeline

# Lints and tests the Python pipeline block. SQL-validation tests run without a
# database; integration tests run against a Postgres service container with the
# packages/db migrations applied (DATABASE_URL gates them on).

on:
  push:
    paths: ["apps/pipeline/**", "packages/**", "security/audit-waivers.json", "railway*.json", ".github/workflows/pipeline.yml"]
  pull_request:
    paths: ["apps/pipeline/**", "packages/**", "security/audit-waivers.json", "railway*.json", ".github/workflows/pipeline.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: serious
          POSTGRES_PASSWORD: serious
          POSTGRES_DB: serious_shift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serious -d serious_shift"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://serious:serious@localhost:5432/serious_shift?sslmode=disable
      # The Postgres above is a throwaway service container, so the tests that
      # TRUNCATE core tables are safe to run here. Never set this against a
      # database whose contents matter.
      SS_ALLOW_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }

      - name: Install dbmate + apply schema
        run: |
          mkdir -p /tmp/dbmate-bin
          GOBIN=/tmp/dbmate-bin go install github.com/amacneil/dbmate/v2@v2.34.1
          sudo install -m 0755 /tmp/dbmate-bin/dbmate /usr/local/bin/dbmate
          DBMATE_MIGRATIONS_DIR=./migrations dbmate up
        working-directory: packages/db

      - name: Install pipeline (dev extras)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
        working-directory: apps/pipeline

      - name: Lint
        # mypy is no longer advisory. It was `|| true` while the tree had 32
        # errors; those are fixed, so a regression should fail the build rather
        # than scroll past in a green log.
        run: |
          ruff check serious_shift_pipeline tests
          mypy serious_shift_pipeline
        working-directory: apps/pipeline

      - name: Dependency audit
        # The scraper fetches and parses arbitrary third-party HTML, so every
        # known Python advisory is release-blocking unless a named, owned,
        # expiring waiver is added to the repository.
        run: pip-audit --requirement requirements.lock --disable-pip
        working-directory: apps/pipeline

      - name: Test (SQL validation + live integration)
        run: pytest -q
        working-directory: apps/pipeline
        env:
          # The ETL manifest regression test imports packages/db/etl by path.
          SS_PACKAGES_DIR: ${{ github.workspace }}/packages

      - name: Build non-root production image
        run: |
          docker build -f apps/pipeline/Dockerfile -t serious-shift-pipeline:ci .
          test "$(docker image inspect serious-shift-pipeline:ci --format '{{.Config.User}}')" = "10001:10001"
