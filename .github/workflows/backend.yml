name: backend

# Compiles the Rust API and smoke-tests it live against Postgres (apply
# migrations, seed a row, hit the endpoints). This is the verification the
# local environment can't do (no Rust toolchain here).

on:
  push:
    paths: ["apps/backend/**", "packages/db/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "packages/db/**", ".github/workflows/backend.yml"]
  workflow_dispatch: {}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serious
          POSTGRES_PASSWORD: serious
          POSTGRES_DB: serious_shift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serious -d serious_shift"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://serious:serious@localhost:5432/serious_shift?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      - name: Apply DB schema + seed
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
          ( cd packages/db && DBMATE_MIGRATIONS_DIR=./migrations dbmate up )
          psql "$DATABASE_URL" -c "INSERT INTO thinkers (name, credibility_score) VALUES ('Smoke Test', 70);"
          psql "$DATABASE_URL" -c "INSERT INTO documents (key, body) VALUES ('map', '{\"ok\":true}'::jsonb);"

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
        working-directory: apps/backend

      - name: Build
        run: cargo build --release
        working-directory: apps/backend

      - name: Smoke test endpoints
        working-directory: apps/backend
        run: |
          set -uo pipefail
          # Use 127.0.0.1 (not "localhost"): the server binds "[::]", and on some
          # runners "localhost" resolves to ::1/127.0.0.1 in an order that races the
          # dual-stack socket. Forcing IPv4 is unambiguous against a v6only=0 bind.
          BASE="http://127.0.0.1:8080"
          ./target/release/serious-shift-backend &
          SERVER=$!

          # Wait for readiness; bail loudly if the process dies during startup.
          ready=""
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER" 2>/dev/null; then
              echo "::error::backend exited during startup"; wait "$SERVER"; exit 1
            fi
            if curl -fsS --max-time 2 "$BASE/health" >/dev/null 2>&1; then
              echo "server ready after ${i}s"; ready=1; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::backend never became ready on $BASE"; kill "$SERVER" 2>/dev/null; exit 1
          fi

          fail=0
          check() {  # check <path> <extended-regex>
            local path="$1" pat="$2" code body
            body=$(curl -sS --max-time 5 -w $'\n%{http_code}' "$BASE$path") || {
              echo "::error::request to $path failed to connect"; fail=1; return; }
            code=$(printf '%s' "$body" | tail -n1)
            body=$(printf '%s' "$body" | sed '$d')
            echo "== GET $path -> HTTP $code =="
            printf '%s\n' "$body" | head -c 400; echo
            if [ "$code" != "200" ]; then
              echo "::error::$path returned HTTP $code (expected 200)"; fail=1; return
            fi
            printf '%s' "$body" | grep -qE "$pat" || {
              echo "::error::$path body did not match /$pat/"; fail=1; }
          }

          check /api/thinkers "Smoke Test"
          check /api/stats '"thinkers":[1-9][0-9]*'
          check /api/map '"ok":true'
          check /api/claims '\[\]'

          kill "$SERVER" 2>/dev/null || true
          exit "$fail"
