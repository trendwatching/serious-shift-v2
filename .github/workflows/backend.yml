name: backend

# Compiles the Rust API and smoke-tests it live against Postgres (apply
# migrations, seed a row, hit the endpoints). This is the verification the
# local environment can't do (no Rust toolchain here).

on:
  push:
    paths: ["apps/backend/**", "packages/db/**", "packages/prompts/**", "railway.backend.json", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "packages/db/**", "packages/prompts/**", "railway.backend.json", ".github/workflows/backend.yml"]
  workflow_dispatch: {}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serious
          POSTGRES_PASSWORD: serious
          POSTGRES_DB: serious_shift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serious -d serious_shift"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://serious:serious@localhost:5432/serious_shift?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      - name: Apply DB schema + seed
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
          ( cd packages/db && DBMATE_MIGRATIONS_DIR=./migrations dbmate up )
          psql "$DATABASE_URL" -c "INSERT INTO thinkers (name, credibility_score) VALUES ('Smoke Test', 70);"
          psql "$DATABASE_URL" -c "INSERT INTO documents (key, body) VALUES ('map', '{\"updated\":\"2026-08-01\",\"domains\":[{\"id\":\"society\",\"name\":\"Society\",\"short_description\":\"Test domain\"}],\"key_trends\":[{\"id\":\"kt-1\",\"domain_id\":\"society\",\"slug\":\"test-shift\",\"name\":\"Test Shift\",\"subtitle\":\"Test\",\"modules\":[]}],\"sub_trends\":[{\"id\":\"st-1\",\"key_trend_id\":\"kt-1\",\"domain_id\":\"society\",\"slug\":\"test-shift/test-sub\",\"name\":\"Test Sub\",\"modules\":[]}],\"synthesis_insights\":[]}'::jsonb);"

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
        working-directory: apps/backend

      - name: Test
        run: cargo test
        working-directory: apps/backend

      - name: Dependency audit
        # Advisory, like pip-audit on the pipeline: an unfixable upstream
        # advisory should be visible without blocking an unrelated deploy.
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || echo "::warning::cargo-audit reported findings"
        working-directory: apps/backend

      - name: Build
        run: cargo build --release
        working-directory: apps/backend

      - name: Smoke test endpoints
        working-directory: apps/backend
        run: |
          set -uo pipefail
          # Use 127.0.0.1 (not "localhost"): the server binds "[::]", and on some
          # runners "localhost" resolves to ::1/127.0.0.1 in an order that races the
          # dual-stack socket. Forcing IPv4 is unambiguous against a v6only=0 bind.
          BASE="http://127.0.0.1:8080"
          # Required in release builds — the server refuses to start without an
          # explicit CORS allowlist rather than defaulting to "any origin".
          export FRONTEND_ORIGIN="http://127.0.0.1:8080"
          export INSPECTION_TOKEN="smoke-secret"
          export STATIC_DIR="$PWD/test-static"
          mkdir -p "$STATIC_DIR/_next/static"
          printf '%s' '<!doctype html><html><head><title>Test</title><meta name="description" content="Test"></head><body><div id="__next"></div></body></html>' > "$STATIC_DIR/index.html"
          printf '%s' 'asset' > "$STATIC_DIR/test.txt"
          printf '%s' 'console.log("ok")' > "$STATIC_DIR/_next/static/test.js"
          ./target/release/serious-shift-backend &
          SERVER=$!

          # Wait for readiness; bail loudly if the process dies during startup.
          ready=""
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER" 2>/dev/null; then
              echo "::error::backend exited during startup"; wait "$SERVER"; exit 1
            fi
            if curl -fsS --max-time 2 "$BASE/health" >/dev/null 2>&1; then
              echo "server ready after ${i}s"; ready=1; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::backend never became ready on $BASE"; kill "$SERVER" 2>/dev/null; exit 1
          fi

          fail=0
          check() {  # check <path> <extended-regex>
            # Pure-bash string ops only — no pipes to head/tail/sed/grep. Those
            # consumers close the pipe early on large bodies, and under `bash -e`
            # + pipefail the resulting SIGPIPE aborts the whole step.
            local path="$1" pat="$2" resp code body
            resp=$(curl -sS --max-time 5 -w $'\n%{http_code}' "$BASE$path") || {
              echo "::error::request to $path failed to connect"; fail=1; return; }
            code="${resp##*$'\n'}"   # last line = http_code
            body="${resp%$'\n'*}"    # everything before it = body
            echo "== GET $path -> HTTP $code (${#body} bytes) =="
            echo "${body:0:400}"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned HTTP $code (expected 200)"; fail=1; return
            fi
            if [[ ! "$body" =~ $pat ]]; then
              echo "::error::$path body did not match /$pat/"; fail=1
            fi
          }

          check_auth() {  # check_auth <path> <extended-regex>
            local path="$1" pat="$2" resp code body
            resp=$(curl -sS --max-time 5 -H 'Authorization: Bearer smoke-secret' -w $'\n%{http_code}' "$BASE$path") || {
              echo "::error::request to $path failed to connect"; fail=1; return; }
            code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; fail=1; return; }
            [[ "$body" =~ $pat ]] || { echo "::error::$path body did not match /$pat/"; fail=1; }
          }

          check_auth /api/thinkers "Smoke Test"
          check_auth /api/stats '"thinkers":[1-9][0-9]*'
          # Document endpoints serve raw jsonb text from Postgres (see the doc
          # cache in main.rs), which renders `{"ok": true}` with a space after
          # the colon — so tolerate optional whitespace rather than assuming
          # serde's compact form.
          check /api/map '"updated": *"2026-08-01"'
          check /api/v1/map '"key_shifts":1'
          check /api/v1/map/society '"key_shifts"'
          check /api/v1/map/society/test-shift '"sub_shifts"'
          check /api/v1/map/society/test-shift/test-sub '"parent_shift"'
          check_auth /api/claims '\[\]'

          # Unknown /api paths must 404 as JSON. The SPA fallback sits behind the
          # API routes, so without an explicit catch-all a mistyped endpoint would
          # answer 200 text/html and an API client would try to parse it.
          expect_code() {  # expect_code <method> <path> <code>
            local code
            code=$(curl -sS -o /dev/null -X "$1" --max-time 5 -w '%{http_code}' "$BASE$2")
            echo "== $1 $2 -> HTTP $code (expected $3) =="
            [ "$code" = "$3" ] || { echo "::error::$2 returned $code, expected $3"; fail=1; }
          }
          expect_code GET  /api/nonexistent          404
          expect_code GET  /api/v1/map/no-such-domain 404
          expect_code GET  /this-route-does-not-exist 404
          expect_code GET  /map/society/test-shift  200
          expect_code GET  /api/thinkers             401
          # The first map request above consumed one burst token.
          expect_code GET  /api/map                  200
          expect_code GET  /api/map                  429
          # Write endpoint stays disabled while INGEST_TOKEN is unset.
          expect_code POST /api/innovations/ingest   404

          check_headers() {
            local path="$1" headers
            headers=$(curl -sS -D - -o /dev/null --max-time 5 "$BASE$path")
            for name in content-security-policy strict-transport-security x-frame-options x-content-type-options referrer-policy; do
              printf '%s' "$headers" | grep -qi "^${name}:" || {
                echo "::error::$path missing $name"; fail=1; }
            done
          }
          check_headers /
          check_headers /map/society/test-shift
          check_headers /test.txt
          check_headers /_next/static/test.js
          check_headers /api/v1/map
          check_headers /this-route-does-not-exist

          etag=$(curl -sS -D - -o /dev/null --max-time 5 "$BASE/api/v1/map/society" \
            | awk 'BEGIN{IGNORECASE=1} /^etag:/{gsub("\\r", ""); print $2}')
          [ -n "$etag" ] || { echo "::error::v1 domain response missing ETag"; fail=1; }
          code=$(curl -sS -o /dev/null --max-time 5 -H "If-None-Match: $etag" \
            -w '%{http_code}' "$BASE/api/v1/map/society")
          [ "$code" = "304" ] || { echo "::error::matching ETag returned $code, expected 304"; fail=1; }

          kill "$SERVER" 2>/dev/null || true
          exit "$fail"
